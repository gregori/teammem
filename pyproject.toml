[project]
name = "teammem"
version = "0.1.0"
description = "Memória compartilhada multi-projeto e multi-harness para agentes de IA, versionada em git e servida via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Gregori" }]
dependencies = [
    "mcp>=2,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
teammem = "teammem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teammem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
